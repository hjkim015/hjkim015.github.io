<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hannah</title>
<link rel="icon" type="image/png" sizes="48x48" href="favicon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&family=IBM+Plex+Mono:wght@400&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f5f8fa;
    --ink:#0d1b26;
    --ink-2:#3f5462;
    --ink-3:#5c6f7c;
    --rule:#ccd9e1;
    --navy:#0a2a6b;
    --navy-deep:#061e4d;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
    --serif:'Newsreader',Georgia,serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--serif);-webkit-font-smoothing:antialiased;overflow:hidden;
       transition:background-color .55s ease,color .55s ease}
  body.is-story{
    --paper:#f1e8dc;
    --ink:#1b1611;
    --ink-2:#5a4e42;
    --ink-3:#7a6d5f;
    --rule:#d4c8b8;
    --navy:#5c4030;
    --navy-deep:#3d2a1e}
  a{color:var(--ink);text-decoration:none}

  .page{position:relative;height:100dvh;display:flex;flex-direction:column;
        --side:max(1in, 24px);
        padding:clamp(96px,10.5vh,128px) var(--side) 0;overflow:hidden}
  .grain,.wash{position:absolute;inset:0;pointer-events:none;z-index:1}
  .grain{opacity:.15;mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='180' height='180'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='180' height='180' filter='url(%23n)' opacity='0.28'/%3E%3C/svg%3E")}
  .wash{background-image:
    radial-gradient(ellipse at 24% 8%,  rgba(92,140,170,.085), rgba(0,0,0,0) 58%),
    radial-gradient(ellipse at 84% 88%, rgba(66,112,146,.07), rgba(0,0,0,0) 60%),
    linear-gradient(180deg, rgba(150,180,196,.07), rgba(0,0,0,0) 46%);
    transition:opacity .55s ease}
  body.is-story .wash{background-image:
    radial-gradient(ellipse at 24% 8%,  rgba(186,150,108,.14), rgba(0,0,0,0) 58%),
    radial-gradient(ellipse at 84% 88%, rgba(140,108,78,.10), rgba(0,0,0,0) 60%),
    linear-gradient(180deg, rgba(196,168,136,.10), rgba(0,0,0,0) 46%)}

  .sig{position:absolute;top:clamp(14px,2.6vw,28px);left:var(--side);z-index:3;
       height:clamp(28px,3.4vw,42px);width:auto;display:block;
       opacity:1;filter:brightness(0) contrast(1.08);
       transition:filter .55s ease}
  body.is-story .sig{filter:sepia(.4) brightness(.2) contrast(1.12)}

  .main{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;
        text-align:center;flex:1 1 auto;min-height:0;width:100%;overflow:hidden}
  .hi{font:300 clamp(22px,3vw,36px)/1.15 var(--serif);font-style:italic;color:var(--ink-3);
      margin:0 0 clamp(2px,.4vh,6px)}

  /* ---- name: halves slide apart, handwriting surfaces ---- */
  .stage{position:relative;display:flex;align-items:center;justify-content:center;
         perspective:1150px;padding:clamp(2px,.4vh,8px) clamp(10px,3vw,40px) 0;
         cursor:pointer;user-select:none;flex:0 0 auto}
  .name{display:flex;align-items:center;transform-style:preserve-3d}
  .name span{font:300 clamp(52px,11vw,132px)/1 var(--serif);letter-spacing:.005em;display:inline-block;
             backface-visibility:hidden;
             transition:transform .8s cubic-bezier(.19,1.06,.3,1),filter .6s ease,opacity .6s ease}
  .stage.on .name .l{transform:translate3d(-152px,0,-70px)}
  .stage.on .name .r{transform:translate3d(152px,0,-70px)}
  .stage.on .name span{filter:blur(1.1px);opacity:.38}

  .surface{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
           transform-style:preserve-3d;pointer-events:none}
  .surface i{font:600 clamp(28px,5vw,62px)/1.1 'Caveat',var(--serif);font-style:normal;
    color:var(--ink);white-space:nowrap;
    transform:translate3d(0,0,-560px);opacity:0;filter:blur(7px);
    transition:transform .85s cubic-bezier(.19,1.06,.3,1) .06s,opacity .5s ease .06s,filter .6s ease .06s}
  .stage.on .surface i{transform:translate3d(0,0,0) rotate(-3.2deg);opacity:1;filter:blur(0)}

  /* ---- one-line bio + menu (tabs continue the sentence) ---- */
  .panelwrap{position:relative;width:100%;display:flex;flex-direction:column;align-items:center;
             flex:1 1 auto;min-height:0;overflow:hidden}
  .barrow{display:flex;flex-wrap:nowrap;justify-content:center;align-items:baseline;gap:0;
          font:300 clamp(16px,1.2vw + 7.5px,25px)/1.28 var(--serif);letter-spacing:.01em;
          color:var(--ink);
          flex:0 0 auto;margin-top:clamp(4px,.7vh,10px);white-space:nowrap;max-width:100%}
  .barrow .lead{white-space:nowrap;padding-right:.7em;flex:0 0 auto}
  .tabs{display:inline-flex;flex-wrap:nowrap;align-items:baseline;flex:0 0 auto;white-space:nowrap}
  .barrow .sep{color:var(--ink-3);user-select:none;padding:0 .72em}
  .tab{appearance:none;background:none;border:0;border-bottom:1px solid transparent;
       font:inherit;color:var(--navy);letter-spacing:inherit;cursor:pointer;
       position:relative;display:inline-block;
       padding:.08em .2em;perspective:600px;transition:border-color .25s ease,color .25s ease}
  .tab .ghost{display:block;visibility:hidden;white-space:nowrap}
  .tab:hover{border-bottom-color:var(--navy);color:var(--navy-deep)}
  .tab[aria-expanded="true"]{border-bottom-color:var(--navy);color:var(--navy-deep)}
  .flip{position:absolute;inset:0;transform-style:preserve-3d;
        transition:transform .68s cubic-bezier(.32,.9,.3,1)}
  .tab:hover .flip,.tab[aria-expanded="true"] .flip{transform:rotateX(-180deg)}
  .face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
        backface-visibility:hidden;white-space:nowrap;color:var(--navy);
        transition:color .25s ease}
  .tab:hover .face,.tab[aria-expanded="true"] .face{color:var(--navy-deep)}
  .back{position:absolute;top:1px;bottom:1px;left:-.62em;right:-.62em;
        backface-visibility:hidden;transform:rotateX(180deg);
        background-position:center;background-repeat:no-repeat;background-size:contain}

  .panel{width:100%;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
         opacity:0;pointer-events:none;transition:opacity .2s ease}
  .panel.open{opacity:1;pointer-events:auto}

  .panel-inner{min-height:0;overflow:hidden;position:relative;
               display:flex;flex-direction:column;align-items:stretch;
               width:calc(100% + 2 * var(--side));
               margin-left:calc(-1 * var(--side));
               margin-right:calc(-1 * var(--side));
               flex:1 1 auto;padding-top:clamp(18px,2.6vh,32px)}

  .gallery{position:relative;width:100%;max-height:100%;
           display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;
           outline:none;flex:1 1 auto;min-height:0}

  .railstage{position:relative;flex:1 1 auto;min-height:clamp(240px,42vh,420px);
             display:flex;flex-direction:column}
  .gallery.is-surfacing .railstage{min-height:clamp(280px,50vh,520px)}

  .spectrum{position:absolute;inset:0;z-index:6;pointer-events:none;
            font:400 10px/1.2 var(--mono);letter-spacing:.14em;color:var(--ink-3);
            user-select:none}
  .spectrum button{pointer-events:auto;position:absolute;left:50%;
                   transform:translateX(-50%)}
  .spectrum [data-sort="time"]{top:0}
  .spectrum [data-sort="favor"]{bottom:0}

  .railbleed{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:visible}

  .card{position:absolute;left:0;top:0;text-align:left;margin:0;
        width:var(--card,220px);opacity:0;pointer-events:none;
        background:var(--paper);transform-origin:50% 0;
        transition:opacity .42s ease,width .42s cubic-bezier(.22,1,.36,1)}
  .card.is-on{width:calc(var(--card,220px) * 1.38)}
  .card.is-on .desc{-webkit-line-clamp:5}
  .card.is-on{pointer-events:auto;z-index:4}
  .card.is-side{z-index:2}
  .title{font:400 clamp(14px,1.4vw,19px)/1.28 var(--serif);color:var(--ink);
         padding-bottom:2px;text-wrap:pretty}
  a.title{border-bottom:1px solid var(--rule);
          transition:color .18s ease,border-color .18s ease}
  a.title:hover{border-bottom-color:var(--navy);color:var(--navy)}
  .role{margin-top:6px;font:300 italic clamp(12px,1.2vw,14px)/1.4 var(--serif);
        color:var(--ink-3)}
  .desc{margin:6px 0 0;font:300 clamp(13px,1.25vw,15px)/1.5 var(--serif);color:var(--ink-2);
        text-wrap:pretty;
        display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .desc.forthcoming{font-style:italic;color:var(--ink-3);-webkit-line-clamp:2}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .tag{font:400 10px var(--mono);letter-spacing:.06em;color:var(--navy);
       border:1px solid color-mix(in srgb, var(--navy) 34%, var(--paper));
       border-radius:999px;padding:3px 9px;white-space:nowrap}

  .spectrum button{appearance:none;background:none;border:0;border-bottom:1px solid transparent;
                   font:inherit;letter-spacing:inherit;color:var(--ink-3);cursor:pointer;
                   padding:0 0 1px;transition:color .2s ease,border-color .2s ease}
  .spectrum button:hover{color:var(--navy)}
  .spectrum button[aria-pressed="true"]{color:var(--navy);border-bottom-color:var(--navy)}
  .spectrum .dash{display:none}

  .railwrap{position:relative;z-index:2;width:min(980px, calc(100% - 2 * var(--side)));
            margin:0 auto;flex:1 1 auto;min-height:0;max-height:100%;
            overflow:visible;display:flex;align-items:stretch}
  .railclip{position:relative;flex:1 1 auto;min-width:0;min-height:0;height:auto;overflow:visible;
            -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 56px,#000 calc(100% - 56px),transparent);
            mask-image:linear-gradient(90deg,transparent 0,#000 56px,#000 calc(100% - 56px),transparent)}
  .rail{position:absolute;inset:0;display:block;width:100%;height:100%;overflow:visible;pointer-events:none}
  .rail .stroke{fill:none;stroke:var(--rule);stroke-width:1;stroke-linecap:square;
                stroke-linejoin:miter}
  .rail .tick{stroke:var(--rule);stroke-width:1;stroke-linecap:square}
  .apex{display:none}
  .is-steering .rail .stroke{stroke:color-mix(in srgb, var(--navy) 38%, var(--rule));stroke-linejoin:round}
  .mark,.dot,.tick-node{position:absolute;left:0;top:0;pointer-events:none}
  .mark{font:400 13px/1 var(--mono);color:var(--navy);letter-spacing:0;
        transform:translate(-50%,-50%)}
  .mark.is-now{font-size:15px}
  .tick-node{width:1px;height:11px;background:var(--ink-3);
             transform:translate(-50%,0)}
  .tick-node.is-now{height:14px;background:var(--navy)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--navy);
       transform:translate(-50%,-50%)}
  .dot.is-now{animation:ripple 2.6s ease-out infinite}
  @keyframes ripple{
    0%{box-shadow:0 0 0 0 color-mix(in srgb, var(--navy) 34%, transparent),
                  0 0 0 0 color-mix(in srgb, var(--navy) 18%, transparent)}
    70%{box-shadow:0 0 0 7px transparent, 0 0 0 13px transparent}
    100%{box-shadow:0 0 0 7px transparent, 0 0 0 13px transparent}
  }

  .nudge{appearance:none;background:none;border:0;padding:0;flex:0 0 22px;align-self:center;
         width:22px;height:22px;cursor:pointer;position:relative;z-index:4;
         color:var(--ink-3);opacity:.42;transition:opacity .2s ease,color .2s ease}
  .nudge:hover{opacity:.9;color:var(--navy)}
  .nudge.is-off{opacity:0;pointer-events:none}
  .nudge::before{content:'';position:absolute;left:50%;top:50%;
                 width:7px;height:7px;margin:-4px 0 0 -5px;
                 border-right:1px solid currentColor;border-top:1px solid currentColor;
                 transform:rotate(45deg)}
  .nudge-l::before{margin-left:-2px;transform:rotate(-135deg)}

  .nodes{position:absolute;inset:0;pointer-events:none;z-index:5}
  .yr{position:absolute;left:0;top:0;
      font:400 10px var(--mono);letter-spacing:.12em;color:var(--ink-3);
      white-space:nowrap;pointer-events:none;
      transform:translate(-50%, calc(-100% - 8px))}

  .belt{position:absolute;inset:0;transition:opacity .2s ease}
  .nodes{transition:opacity .2s ease}
  .belt.is-restir,.nodes.is-restir{opacity:0}

  /* inventing — squares slide along the ruler */
  .is-inventing .card{aspect-ratio:1;display:flex;flex-direction:column;
                     border:1px solid var(--rule);border-radius:1px;padding:14px 16px 16px}
  .is-inventing .desc{-webkit-line-clamp:unset;overflow:visible}
  .is-inventing .tags{margin-top:auto;padding-top:10px}

  .gallery.is-surfacing .card,
  .gallery.is-surfacing .card.is-on{
    padding:36px 28px 32px;border:0 !important;background:transparent !important;
    box-shadow:none !important;isolation:auto;overflow:visible}
  .hues{display:none}
  .is-surfacing .hues{display:block;position:absolute;left:-20%;right:-20%;top:22%;bottom:-35%;
                     z-index:-1;pointer-events:none}
  .is-surfacing .hue{display:block;position:absolute;left:var(--hx,50%);top:var(--hy,62%);
    width:var(--hs,64%);aspect-ratio:1 / 1;border-radius:50%;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle closest-side,
      color-mix(in srgb, var(--navy) calc(14% + var(--ht, 0) * 4%), transparent) 0%,
      color-mix(in srgb, var(--navy) 6%, transparent) 35%,
      transparent 72%);
    box-shadow:none;filter:none;border:0;
    opacity:calc(.4 + var(--presence, 0) * .45)}
  .gallery.is-surfacing,
  .gallery.is-surfacing .belt,
  .gallery.is-surfacing .railclip,
  .gallery.is-surfacing .railwrap,
  .gallery.is-surfacing .railstage{overflow:visible}

  /* steering — same footprint as inventing, turning plate instead of a square rule */
  .is-steering .card{aspect-ratio:1;display:flex;flex-direction:column;
                    padding:16px 18px 16px;border:0;
                    border-radius:4px 28px 28px 4px;
                    background:color-mix(in srgb, var(--paper) 82%, transparent);
                    box-shadow:10px 2px 22px -12px color-mix(in srgb, var(--navy) 28%, transparent)}
  .is-steering .desc{-webkit-line-clamp:unset;overflow:visible}
  .is-steering .tags{margin-top:auto;padding-top:10px}

  .foot{position:relative;z-index:2;flex:0 0 auto;
        display:flex;flex-wrap:wrap;align-items:center;font:400 12px var(--mono);letter-spacing:.06em;
        padding:clamp(12px,1.8vh,22px) 0 clamp(16px,3vw,28px)}
  .foot a{color:var(--ink-2);padding:0 9px;transition:color .18s ease}
  .foot a:first-child{padding-left:0}
  .foot a:last-child{padding-right:0}
  .foot a:hover{color:var(--navy)}
  .foot .sep{color:var(--ink-3);user-select:none}

  @media (max-width:720px){
    .page{--side:20px}
    .barrow{flex-wrap:wrap;white-space:normal}
    .barrow .lead{flex:1 1 100%;padding:0 0 10px;text-align:center;white-space:normal}
    .tabs{flex:1 1 100%;justify-content:center}
    .stage.on .name .l{transform:translate3d(-96px,0,-70px)}
    .stage.on .name .r{transform:translate3d(96px,0,-70px)}
  }
  @media (max-height:740px){
    .panel-inner{padding-top:clamp(12px,1.8vh,22px)}
    .railstage{min-height:clamp(200px,40vh,300px)}
    .gallery.is-surfacing .railstage{min-height:clamp(220px,46vh,360px)}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition-duration:.01ms !important;animation:none !important}
    .card{transition:none}
    .belt,.nodes{transition:none}
    .dot.is-now{animation:none}
  }
</style>
</head>
<body>
<div class="page">
  <div class="grain"></div>
  <div class="wash"></div>

  <img class="sig" src="ink-signature-slate.png" alt="hannah">

  <main class="main">
    <div class="hi">hi, i'm</div>

    <div class="stage" id="stage">
      <div class="name"><span class="l">han</span><span class="r">nah</span></div>
      <div class="surface"><i aria-label="existence between -1 to 0">existence between -1 to 0</i></div>
    </div>

    <div class="panelwrap">
      <nav class="barrow" id="menu">
        <span class="lead">a human walking through life by…</span>
        <span class="tabs">
          <button class="tab" data-key="steering" aria-expanded="false"><span class="ghost" aria-hidden="true">steering</span><span class="flip"><span class="face">steering</span><span class="back" style="background-image:url(ink-culture.png)"></span></span></button>
          <span class="sep">/</span>
          <button class="tab" data-key="inventing" aria-expanded="false"><span class="ghost" aria-hidden="true">inventing</span><span class="flip"><span class="face">inventing</span><span class="back" style="background-image:url(ink-technology.png)"></span></span></button>
          <span class="sep">/</span>
          <button class="tab" data-key="surfacing" aria-expanded="false"><span class="ghost" aria-hidden="true">surfacing</span><span class="flip"><span class="face">surfacing</span><span class="back" style="background-image:url(ink-blind-spots.png)"></span></span></button>
        </span>
      </nav>

      <div class="panel" id="panel">
        <div class="panel-inner">
          <div class="gallery" id="gallery" tabindex="0" role="region"
               aria-label="projects, scroll sideways">
            <div class="railstage">
              <div class="railbleed" id="railbleed">
                <svg class="rail" id="rail" aria-hidden="true"></svg>
                <div class="apex" id="apex"></div>
                <div class="nodes" id="nodes"></div>
              </div>
              <div class="railwrap" id="railwrap">
                <button type="button" class="nudge nudge-l is-off" id="nudgeL" aria-label="previous project" disabled></button>
                <div class="railclip" id="railclip">
                  <div class="belt" id="belt"></div>
                </div>
                <button type="button" class="nudge nudge-r is-off" id="nudgeR" aria-label="next project" disabled></button>
              </div>
              <div class="spectrum" id="spectrum" role="group" aria-label="project order">
                <button type="button" data-sort="time" aria-pressed="true">the record</button>
                <button type="button" data-sort="favor" aria-pressed="false">the story</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="foot" id="foot">
    <a href="https://linkedin.com/in/hjkim015" target="_blank" rel="noopener noreferrer">linkedin</a><span class="sep">/</span>
    <a href="https://github.com/hjkim015" target="_blank" rel="noopener noreferrer">github</a><span class="sep">/</span>
    <a href="https://hjkim.substack.com/" target="_blank" rel="noopener noreferrer">substack</a><span class="sep">/</span>
    <a href="https://x.com/hjkim0151" target="_blank" rel="noopener noreferrer">x</a><span class="sep">/</span>
    <a href="mailto:hannah.kim@alumni.harvard.edu">email</a>
  </footer>
</div>

<script>
/* ============================================================
   EDIT YOUR PROJECTS HERE — this is the only block you touch.

   Each of the three keys holds a flat array of entries:
     { title, date, tag, desc, role, href, favor }
   title  required. everything else optional.
   tag    one string, or an array for two pills: tag: ['research','interpretability']
          written in the casing you want to see (tags are not uppercased).
   role   optional italic line under the title (CV-style)
   desc   optional one-liner
   href   the URL. The title IS the link. Leave the key out and the title
          renders as plain text — add it later and the link appears.
   favor  optional number; lower comes first in “the story”.
          omit and the project sorts after numbered ones.
   Dates live on the rail, not in the card.
   ============================================================ */
const PROJECTS = {
  steering: [
    { title: 'Boston Diffusion Day', date: '2025 —', tag: ['founding','0–1'],
      role: 'Co-Founder & Advisor',
      desc: 'Pushed for the first ever Northeast academic symposium focused on generative modeling. Bootstrapped in 2 months with 2 people.',
      href: 'https://bostondiffusionday.github.io/', favor: 1 },
    { title: 'WECode', date: '2024', tag: 'leading',
      role: 'Advisory Board, former Co-Chair and Co-Director of Engagement',
      desc: "Led the world's largest undergraduate-run women in tech conference.",
      href: 'https://www.wecodeconference.com/', favor: 2 },
    { title: 'AI Safety Team at Harvard', date: '2024', tag: 'operating',
      role: 'former Board Member, Technical & Policy Fellow',
      desc: 'Pushing for artificial intelligence that is built safely and ethically.',
      href: 'https://aisst.ai/', favor: 3 },
    { title: 'Tech for Social Good', date: '2022', tag: 'operating',
      role: 'Project Manager, Internal Research Committee',
      desc: 'Pushing for projects that make technology helpful to everyone, and ensuring the organization itself is focused on mission.',
      href: 'https://socialgood.hcs.harvard.edu/', favor: 4 }
  ],
  inventing: [
    { title: 'Ctrl+Alt+Defeat: Cybersecurity Virtual Simulation', date: '2026', tag: 'software', favor: 4 },
    { title: 'Music262', date: '2025', tag: 'software',
      desc: 'Peer-based distributed system for music synchronization.', favor: 3 },
    { title: 'SPYDER: Drone Detection', date: '2025', tag: 'software', favor: 5 },
    { title: 'DAPPS 4.0', date: '2023', tag: 'software',
      desc: 'U.S. Census Bureau population projection.',
      href: 'https://www.census.gov/data/software/dapps.html', favor: 1 },
    { title: 'Questable', date: '2022', tag: 'software',
      desc: 'Open-source edtech software.',
      href: 'https://github.com/hcs-t4sg/questable', favor: 2 },
    { title: 'Lawrence Hall of Science Marine Aquatic Exhibit', date: '2018', tag: 'robotics', favor: 6 }
  ],
  surfacing: [
    { title: "For Students, the Process of 'Becoming' is the Challenge No Chatbot Can Solve",
      date: '2026', tag: 'writing',
      desc: 'Opinion piece for Tech Policy Press x Berkman Klein Center.',
      href: 'https://www.techpolicy.press/for-students-the-process-of-becoming-is-the-challenge-no-chatbot-can-solve/',
      favor: 1 },
    { title: 'Inaugural Braille Seminar', date: '2025', tag: 'manufacturing',
      desc: '3D tactile map for the blind.',
      href: 'https://news.harvard.edu/gazette/story/2025/04/new-experiences-at-their-fingertips/',
      favor: 2 },
    { title: 'HSYLC: The Age of the AI Agent', date: '2026', tag: 'teaching',
      desc: 'Materials coming soon.', favor: 3 },
    { title: 'Cambria', date: '2026', tag: ['research','interpretability'],
      desc: 'Emotion vectors over time in Claude.',
      href: 'https://www.cbai.ai/cambria', favor: 4 },
    { title: 'Kempner Institute', date: '2025', tag: 'diffusion models',
      desc: 'Diffusion models.',
      href: 'https://kempnerinstitute.harvard.edu/', favor: 5 },
    { title: 'Dtak Lab', date: '2025', tag: 'HCI',
      desc: 'Humanitarian negotiation and AI engagement.',
      href: 'https://dtak.github.io/Negotiation/', favor: 6 },
    { title: 'Kreiman Lab', date: '2023', tag: 'neuroAI',
      desc: 'Neuroscience and AI.',
      href: 'https://kreimanlab.com/', favor: 7 }
  ]
};
/* ========================= end edit ========================= */

const stage     = document.getElementById('stage');
const panel     = document.getElementById('panel');
const gallery   = document.getElementById('gallery');
const railbleed = document.getElementById('railbleed');
const rail      = document.getElementById('rail');
const railclip  = document.getElementById('railclip');
const nodesEl   = document.getElementById('nodes');
const belt      = document.getElementById('belt');
const apex      = document.getElementById('apex');
const nudgeL    = document.getElementById('nudgeL');
const nudgeR    = document.getElementById('nudgeR');
const spectrum  = document.getElementById('spectrum');
const calm      = matchMedia('(prefers-reduced-motion: reduce)');
let openKey = null;
let sortMode = 'time';
let items = [];
let t = 0;
let shown = 0;
let geo = null;
let viewbox = null;
let anim = 0;
let wheelAcc = 0;
let wheelLock = 0;
let wheelDecay = 0;

/* Wheel: ~2.5× less twitchy than 1-event / 280ms.
   Pixel deltas scaled 0.4; step after 90 of accumulated delta; 520ms lock. */
const WHEEL_SCALE = 0.4;
const WHEEL_STEP = 90;
const WHEEL_COOL = 520;

const LANES = [
  { dx: -28, dy: 14 },
  { dx:  32, dy: 22 },
  { dx: -16, dy: 30 },
  { dx:  20, dy: 16 }
];

stage.addEventListener('mouseenter', () => stage.classList.add('on'));
stage.addEventListener('mouseleave', () => stage.classList.remove('on'));

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function whenScore(date){
  const s = String(date || '');
  const year = Number((s.match(/\d{4}/) || [0])[0]);
  const ongoing = /[—–-]\s*$|present|ongoing|now/i.test(s.replace(/\d{4}/, ''));
  return year + (ongoing ? 0.5 : 0);
}

function sortItems(list){
  const arr = (list || []).slice();
  if (sortMode === 'favor'){
    return arr.sort((a, b) => (a.favor ?? 999) - (b.favor ?? 999) || whenScore(b.date) - whenScore(a.date));
  }
  return arr.sort((a, b) => whenScore(b.date) - whenScore(a.date));
}

function yAtX(verts, x){
  if (!verts.length) return 0;
  if (x <= verts[0].x) return verts[0].y;
  for (let i = 1; i < verts.length; i++){
    const a = verts[i - 1], b = verts[i];
    if (x <= b.x || i === verts.length - 1){
      const dx = b.x - a.x;
      const u = dx ? clamp((x - a.x) / dx, 0, 1) : 1;
      return a.y + (b.y - a.y) * u;
    }
  }
  return verts[verts.length - 1].y;
}

function spanFor(w){
  return w < 520 ? 0.46 : 0.34;
}

function measure(){
  const full = railbleed.getBoundingClientRect();
  const clip = railclip.getBoundingClientRect();
  return {
    W: railbleed.clientWidth,
    H: railbleed.clientHeight,
    originX: clip.left - full.left,
    originY: clip.top - full.top,
    winW: railclip.clientWidth,
    winH: railclip.clientHeight
  };
}

function layout(mode, W, H, winW){
  const pad = 10;
  const x1 = pad, x2 = W - pad;
  const span = spanFor(winW) * (winW / Math.max(W, 1));
  if (mode === 'inventing'){
    const y = 30;
    const spacing = winW * spanFor(winW);
      const card = Math.round(clamp(spacing * 0.92, 148, Math.min(280, H - 40)));
    return {
      kind:'line', d:`M${x1},${y} H${x2}`, x1, x2, y, span, card, hang: 12,
      at(u){ return {x: x1 + (x2 - x1) * u, y}; }
    };
  }
  if (mode === 'surfacing'){
    const card = Math.round(clamp(winW * 0.34, 200, 320));
    const cy = Math.max(H * 0.78, 150);
    const rx = (x2 - x1) / 2;
    const ry = Math.max(130, Math.min(rx * 0.72, cy - 18, H * 0.82));
    const cx = W / 2;
    const d = `M${x1.toFixed(1)},${cy.toFixed(1)} A${rx.toFixed(1)},${ry.toFixed(1)} 0 0 1 ${x2.toFixed(1)},${cy.toFixed(1)}`;
    return {
      kind:'arc', d, cx, cy, rx, ry, span, card, hang: 36,
      at(u){
        const a = Math.PI * (1 - u);
        return {x: cx + rx * Math.cos(a), y: cy - ry * Math.sin(a)};
      }
    };
  }
  const spacing = winW * spanFor(winW);
  const card = Math.round(clamp(spacing * 0.92, 148, Math.min(280, H - 40)));
  const yMid = 68;
  const amp = Math.min((H - 150) * 0.28, 52);
  /* Meander around implied blocks; keep the focus on a mid run, not in a trough. */
  const way = [
    [0.00,  0.18],
    [0.08,  0.18],
    [0.14, -0.88],
    [0.27, -0.88],
    [0.35,  0.08],
    [0.50,  0.08],
    [0.58,  0.08],
    [0.66,  0.92],
    [0.78,  0.92],
    [0.86, -0.42],
    [0.94, -0.42],
    [1.00,  0.12]
  ];
  const verts = way.map(([p, v]) => ({x: x1 + (x2 - x1) * p, y: yMid + amp * v}));
  const d = verts.map((p, i) => `${i ? 'L' : 'M'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join('');
  return {
    kind:'poly', d, verts, span, card, hang: 14,
    at(u){
      const x = x1 + (x2 - x1) * u;
      return {x, y: yAtX(verts, x)};
    },
    swing(x){
      const y0 = yAtX(verts, x - 26);
      const y1 = yAtX(verts, x);
      const y2 = yAtX(verts, x + 26);
      const curv = y2 - 2 * y1 + y0;
      return {
        dx: clamp((y0 - y2) * 0.22, -12, 12),
        dy: clamp(-curv * 0.42, -16, 16)
      };
    }
  };
}

function atOff(off){
  if (!geo) return {x:0,y:0};
  const u = clamp(0.5 + off * geo.span, 0.015, 0.985);
  return geo.at(u);
}

function cardOpacity(off){
  const a = Math.abs(off);
  if (a >= 1.22) return 0;
  if (a <= 0.06) return 1;
  return clamp(1 - (a / 1.18) * 0.74, 0.28, 1);
}

function focusScale(off){
  const k = clamp(1 - Math.abs(off), 0, 1);
  const e = k * k * (3 - 2 * k);
  return { x: 0.68 + 0.64 * e, y: 0.78 + 0.34 * e };
}

function yearPresence(x, vb){
  const lx = x - vb.originX;
  const {winW, W} = vb;
  if (lx >= 0 && lx <= winW){
    const edge = 56;
    if (lx < edge) return 0.42 + 0.58 * (lx / edge);
    if (lx > winW - edge) return 0.42 + 0.58 * ((winW - lx) / edge);
    return 1;
  }
  const dist = lx < 0 ? -lx : lx - winW;
  const margin = Math.max((W - winW) / 2, 48);
  return clamp(0.22 * (1 - dist / margin), 0.05, 0.22);
}

function yearLabel(i){
  const d = String(items[i].date || '');
  if (!d) return '';
  const ongoing = /[—–-]\s*$|present|ongoing|now/i.test(d.replace(/\d{4}/, ''));
  if (ongoing) return d;
  if (i === 0) return d;
  const prev = String(items[i - 1].date || '');
  const y = (d.match(/\d{4}/) || [''])[0];
  const py = (prev.match(/\d{4}/) || [''])[0];
  return y && y === py ? '' : d;
}

function hueClouds(p, i){
  const layouts = [
    {x:50, y:64, s:64, t:0},
    {x:48, y:66, s:62, t:1},
    {x:52, y:63, s:66, t:0},
    {x:49, y:67, s:60, t:2},
    {x:51, y:65, s:63, t:1},
    {x:50, y:68, s:61, t:0},
    {x:48, y:64, s:65, t:2}
  ];
  const h = layouts[i % layouts.length];
  return `<span class="hues" aria-hidden="true"><span class="hue" style="--hx:${h.x}%;--hy:${h.y}%;--hs:${h.s}%;--ht:${h.t}"></span></span>`;
}

function cardHTML(p, i){
  const tags = [].concat(p.tag || []).filter(Boolean);
  const title = esc(p.title);
  const desc = p.desc
    ? `<p class="desc">${esc(p.desc)}</p>`
    : `<p class="desc forthcoming">description forthcoming.</p>`;
  return `
    ${hueClouds(p, i)}
    ${p.href
      ? `<a class="title" href="${esc(p.href)}" target="_blank" rel="noopener noreferrer">${title}</a>`
      : `<span class="title">${title}</span>`}
    ${p.role ? `<div class="role">${esc(p.role)}</div>` : ''}
    ${desc}
    ${tags.length ? `<div class="tags">${tags.map(tg => `<span class="tag">${esc(tg)}</span>`).join('')}</div>` : ''}`;
}

function setNudge(el, off){
  el.classList.toggle('is-off', off);
  el.disabled = off;
}

function paint(){
  if (!geo || !viewbox || !items.length) return;
  const hang = geo.hang;
  items.forEach((_, i) => {
    const el = belt.children[i];
    if (!el) return;
    const off = i - t;
    const op = cardOpacity(off);
    const pt = atOff(off);
    let dx = 0, dy = hang, rot = 0;
    if (openKey === 'steering'){
      const focus = clamp(1 - Math.abs(off), 0, 1);
      const lane = LANES[i % LANES.length];
      const swing = geo.swing ? geo.swing(pt.x) : {dx:0, dy:0};
      dx = lane.dx * (0.22 + (1 - focus) * 0.78) + swing.dx * focus;
      dy = hang + lane.dy * (0.18 + (1 - focus) * 0.82) + swing.dy * focus;
      rot = clamp(swing.dx * 0.42 + lane.dx * 0.04, -8, 8);
    } else if (openKey === 'surfacing'){
      const k = 1 - clamp(Math.abs(off), 0, 1.15);
      dy = hang + (1 - k * k) * 26;
    }
    const s = focusScale(off);
    el.style.transform = `translate(${pt.x - viewbox.originX + dx}px, ${pt.y - viewbox.originY + dy}px) translate(-50%, 0) scale(${s.x}, ${s.y}) rotate(${rot}deg)`;
    const footTop = document.getElementById('foot').getBoundingClientRect().top;
    const box = el.getBoundingClientRect();
    if (box.bottom > footTop - 10){
      dy -= box.bottom - (footTop - 10);
      el.style.transform = `translate(${pt.x - viewbox.originX + dx}px, ${pt.y - viewbox.originY + dy}px) translate(-50%, 0) scale(${s.x}, ${s.y}) rotate(${rot}deg)`;
    }
    el.style.opacity = String(op);
    el.style.setProperty('--presence', op.toFixed(3));
    el.style.pointerEvents = op > 0.2 ? 'auto' : 'none';
    el.classList.toggle('is-on', Math.abs(off) < 0.45);
    el.classList.toggle('is-side', op > 0.05 && Math.abs(off) >= 0.45);
    el.setAttribute('aria-hidden', op < 0.08 ? 'true' : 'false');
  });

  const labels = [];
  items.forEach((_, i) => {
    const off = i - t;
    const pt = atOff(off);
    const edge = yearPresence(pt.x, viewbox);
    const now = Math.abs(off) < 0.45;
    const a = now ? 1 : Math.max(0.2, edge * (Math.abs(off) < 1.25 ? 0.95 : 0.5));
    const cls = now ? ' is-now' : '';
    const pos = `left:${pt.x}px;top:${pt.y}px;opacity:${a.toFixed(2)}`;
    if (openKey === 'steering')
      labels.push(`<span class="mark${cls}" style="${pos}">&gt;</span>`);
    else if (openKey === 'surfacing')
      labels.push(`<span class="dot${cls}" style="${pos}"></span>`);
    else
      labels.push(`<span class="tick-node${cls}" style="${pos}"></span>`);
    const yr = yearLabel(i);
    if (yr) labels.push(`<span class="yr" style="left:${pt.x}px;top:${pt.y}px;opacity:${a.toFixed(2)}">${esc(yr)}</span>`);
  });
  nodesEl.innerHTML = labels.join('');
  setNudge(nudgeL, shown <= 0);
  setNudge(nudgeR, shown >= items.length - 1);
}

function draw(){
  viewbox = measure();
  const {W, H, winW} = viewbox;
  if (W < 8 || H < 8 || !openKey || !items.length) return;
  geo = layout(openKey, W, H, winW);
  gallery.style.setProperty('--card', geo.card + 'px');
  const parts = [`<path class="stroke" d="${geo.d}"/>`];
  if (geo.kind === 'line'){
    const units = Math.max(40, Math.round(W / 32));
    for (let i = 0; i <= units; i++){
      const x = geo.x1 + (geo.x2 - geo.x1) * i / units;
      const hh = i % 8 === 0 ? 9 : i % 4 === 0 ? 5 : 3;
      parts.push(`<line class="tick" x1="${x}" y1="${geo.y}" x2="${x}" y2="${geo.y + hh}"/>`);
    }
  }
  rail.setAttribute('viewBox', `0 0 ${W} ${H}`);
  rail.setAttribute('preserveAspectRatio', 'none');
  rail.innerHTML = parts.join('');
  paint();
}

function animateT(to){
  const from = t;
  const start = performance.now();
  const dur = 480;
  cancelAnimationFrame(anim);
  const tick = now => {
    const p = Math.min(1, (now - start) / dur);
    const e = 1 - Math.pow(1 - p, 3);
    t = from + (to - from) * e;
    paint();
    if (p < 1) anim = requestAnimationFrame(tick);
    else { t = to; paint(); }
  };
  anim = requestAnimationFrame(tick);
}

function go(i, instant){
  const max = Math.max(items.length - 1, 0);
  const next = clamp(i, 0, max);
  shown = next;
  if (instant || calm.matches){
    cancelAnimationFrame(anim);
    t = next;
    paint();
    return;
  }
  animateT(next);
}

function render(key, keepTitle){
  items = sortItems(PROJECTS[key] || []);
  gallery.classList.remove('is-inventing', 'is-surfacing', 'is-steering');
  gallery.classList.add('is-' + key);
  let start = 0;
  if (keepTitle){
    const i = items.findIndex(p => p.title === keepTitle);
    if (i >= 0) start = i;
  }
  shown = start;
  t = start;
  cancelAnimationFrame(anim);
  belt.innerHTML = items.map((p, i) =>
    `<article class="card" data-i="${i}">${cardHTML(p, i)}</article>`).join('');
  nodesEl.innerHTML = '';
  requestAnimationFrame(() => {
    draw();
    requestAnimationFrame(draw);
  });
}

function markSort(){
  spectrum.querySelectorAll('button[data-sort]').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.sort === sortMode)));
  document.body.classList.toggle('is-story', sortMode === 'favor');
}

function restir(){
  if (!openKey) return;
  const keep = items[shown] && items[shown].title;
  const run = () => render(openKey, keep);
  if (calm.matches){ run(); return; }
  belt.classList.add('is-restir');
  nodesEl.classList.add('is-restir');
  setTimeout(() => {
    run();
    requestAnimationFrame(() => {
      belt.classList.remove('is-restir');
      nodesEl.classList.remove('is-restir');
    });
  }, 200);
}

spectrum.addEventListener('click', e => {
  const btn = e.target.closest('button[data-sort]');
  if (!btn || btn.dataset.sort === sortMode) return;
  sortMode = btn.dataset.sort;
  markSort();
  restir();
});

belt.addEventListener('click', e => {
  const card = e.target.closest('.card');
  if (!card) return;
  const i = +card.dataset.i;
  if (i !== shown){
    e.preventDefault();
    go(i, calm.matches);
    gallery.focus();
  }
});

nudgeL.addEventListener('click', () => { go(shown - 1, calm.matches); gallery.focus(); });
nudgeR.addEventListener('click', () => { go(shown + 1, calm.matches); gallery.focus(); });

panel.addEventListener('wheel', e => {
  if (!openKey || items.length < 2) return;
  const primary = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  if (!primary) return;
  e.preventDefault();
  let d = primary;
  if (e.deltaMode === 1) d *= 40;
  else if (e.deltaMode === 2) d *= 80;
  else d *= WHEEL_SCALE;
  if (Math.sign(d) && Math.sign(wheelAcc) && Math.sign(d) !== Math.sign(wheelAcc)) wheelAcc = 0;
  wheelAcc += d;
  clearTimeout(wheelDecay);
  wheelDecay = setTimeout(() => { wheelAcc = 0; }, 220);
  const now = Date.now();
  if (now < wheelLock) return;
  if (Math.abs(wheelAcc) < WHEEL_STEP) return;
  const dir = Math.sign(wheelAcc);
  wheelAcc = 0;
  wheelLock = now + (calm.matches ? 90 : WHEEL_COOL);
  go(shown + dir, calm.matches);
}, {passive: false});

gallery.addEventListener('keydown', e => {
  if (!openKey || !items.length) return;
  if (e.key === 'ArrowRight')      go(shown + 1, calm.matches);
  else if (e.key === 'ArrowLeft')  go(shown - 1, calm.matches);
  else if (e.key === 'Home')       go(0, calm.matches);
  else if (e.key === 'End')        go(items.length - 1, calm.matches);
  else return;
  e.preventDefault();
});

window.addEventListener('resize', () => { if (openKey) draw(); });

const FADE_MS = 200;
let turn = 0, swapTimer = 0;

function setCategory(key){
  const me = ++turn;
  clearTimeout(swapTimer);
  const showing = panel.classList.contains('open');
  panel.classList.remove('open');

  const wait = (showing && !calm.matches) ? FADE_MS : 0;
  swapTimer = setTimeout(() => {
    if (me !== turn) return;
    document.querySelectorAll('.tab').forEach(b =>
      b.setAttribute('aria-expanded', String(b.dataset.key === key)));
    if (key){
      render(key);
      panel.classList.add('open');
      gallery.focus();
    } else {
      items = [];
      geo = null;
      shown = 0;
      t = 0;
      belt.innerHTML = '';
      nodesEl.innerHTML = '';
      rail.innerHTML = '';
      setNudge(nudgeL, true);
      setNudge(nudgeR, true);
    }
  }, wait);
}

document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    openKey = openKey === btn.dataset.key ? null : btn.dataset.key;
    setCategory(openKey);
  });
});
</script>
