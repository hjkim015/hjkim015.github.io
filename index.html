<style>
  :root{
    --paper:#f5f8fa;
    --ink:#0d1b26;
    --ink-2:#3f5462;
    --ink-3:#5c6f7c;
    --rule:#ccd9e1;
    --navy:#0a2a6b;
    --navy-deep:#061e4d;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
    --serif:'Newsreader',Georgia,serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--serif);-webkit-font-smoothing:antialiased;overflow:hidden}
  a{color:var(--ink);text-decoration:none}

  .page{position:relative;height:100dvh;display:flex;flex-direction:column;
        --side:max(1in, 24px);
        padding:clamp(96px,10.5vh,128px) var(--side) 0;overflow:hidden}
  .grain,.wash{position:absolute;inset:0;pointer-events:none;z-index:1}
  .grain{opacity:.15;mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='180' height='180'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='180' height='180' filter='url(%23n)' opacity='0.28'/%3E%3C/svg%3E")}
  .wash{background-image:
    radial-gradient(ellipse at 24% 8%,  rgba(92,140,170,.085), rgba(0,0,0,0) 58%),
    radial-gradient(ellipse at 84% 88%, rgba(66,112,146,.07), rgba(0,0,0,0) 60%),
    linear-gradient(180deg, rgba(150,180,196,.07), rgba(0,0,0,0) 46%)}

  .sig{position:absolute;top:clamp(14px,2.6vw,28px);left:var(--side);z-index:3;
       height:clamp(28px,3.4vw,42px);width:auto;display:block;
       opacity:1;filter:brightness(0) contrast(1.08)}

  .main{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;
        text-align:center;flex:1 1 auto;min-height:0;width:100%;overflow:hidden}
  .hi{font:300 clamp(22px,3vw,36px)/1.15 var(--serif);font-style:italic;color:var(--ink-3);
      margin:0 0 clamp(2px,.4vh,6px)}

  /* ---- name: halves slide apart, handwriting surfaces ---- */
  .stage{position:relative;display:flex;align-items:center;justify-content:center;
         perspective:1150px;padding:clamp(2px,.4vh,8px) clamp(10px,3vw,40px) 0;
         cursor:pointer;user-select:none;flex:0 0 auto}
  .name{display:flex;align-items:center;transform-style:preserve-3d}
  .name span{font:300 clamp(52px,11vw,132px)/1 var(--serif);letter-spacing:.005em;display:inline-block;
             backface-visibility:hidden;
             transition:transform .8s cubic-bezier(.19,1.06,.3,1),filter .6s ease,opacity .6s ease}
  .stage.on .name .l{transform:translate3d(-152px,0,-70px)}
  .stage.on .name .r{transform:translate3d(152px,0,-70px)}
  .stage.on .name span{filter:blur(1.1px);opacity:.38}

  .surface{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
           transform-style:preserve-3d;pointer-events:none}
  .surface i{font:600 clamp(28px,5vw,62px)/1.1 'Caveat',var(--serif);font-style:normal;
    color:var(--ink);white-space:nowrap;
    transform:translate3d(0,0,-560px);opacity:0;filter:blur(7px);
    transition:transform .85s cubic-bezier(.19,1.06,.3,1) .06s,opacity .5s ease .06s,filter .6s ease .06s}
  .stage.on .surface i{transform:translate3d(0,0,0) rotate(-3.2deg);opacity:1;filter:blur(0)}

  /* ---- one-line bio + menu (tabs continue the sentence) ---- */
  .panelwrap{position:relative;width:100%;display:flex;flex-direction:column;align-items:center;
             flex:1 1 auto;min-height:0;overflow:hidden}
  .barrow{display:flex;flex-wrap:nowrap;justify-content:center;align-items:baseline;gap:0;
          font:300 clamp(16px,1.2vw + 7.5px,25px)/1.28 var(--serif);letter-spacing:.01em;
          color:var(--ink);
          flex:0 0 auto;margin-top:clamp(4px,.7vh,10px);white-space:nowrap;max-width:100%}
  .barrow .lead{white-space:nowrap;padding-right:.7em;flex:0 0 auto}
  .tabs{display:inline-flex;flex-wrap:nowrap;align-items:baseline;flex:0 0 auto;white-space:nowrap}
  .barrow .sep{color:var(--ink-3);user-select:none;padding:0 .72em}
  .tab{appearance:none;background:none;border:0;border-bottom:1px solid transparent;
       font:inherit;color:var(--navy);letter-spacing:inherit;cursor:pointer;
       position:relative;display:inline-block;
       padding:.08em .2em;perspective:600px;transition:border-color .25s ease,color .25s ease}
  .tab .ghost{display:block;visibility:hidden;white-space:nowrap}
  .tab:hover{border-bottom-color:var(--navy);color:var(--navy-deep)}
  .tab[aria-expanded="true"]{border-bottom-color:var(--navy);color:var(--navy-deep)}
  .flip{position:absolute;inset:0;transform-style:preserve-3d;
        transition:transform .68s cubic-bezier(.32,.9,.3,1)}
  .tab:hover .flip,.tab[aria-expanded="true"] .flip{transform:rotateX(-180deg)}
  .face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
        backface-visibility:hidden;white-space:nowrap;color:var(--navy);
        transition:color .25s ease}
  .tab:hover .face,.tab[aria-expanded="true"] .face{color:var(--navy-deep)}
  .back{position:absolute;top:1px;bottom:1px;left:-.62em;right:-.62em;
        backface-visibility:hidden;transform:rotateX(180deg);
        background-position:center;background-repeat:no-repeat;background-size:contain}

  .panel{width:100%;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
         opacity:0;pointer-events:none;transition:opacity .2s ease}
  .panel.open{opacity:1;pointer-events:auto}
  .panel-inner{min-height:0;overflow:hidden;position:relative;
               display:flex;flex-direction:column;align-items:center;
               width:100%;flex:1 1 auto;padding-top:clamp(28px,4vh,48px)}

  .gallery{position:relative;width:min(100%,980px);max-height:100%;
           display:flex;flex-direction:column;align-items:stretch;
           outline:none;flex:1 1 auto;min-height:0}

  .card{position:absolute;left:0;top:0;text-align:left;margin:0;
        width:var(--card,220px);opacity:0;pointer-events:none;
        background:var(--paper);
        transition:opacity .42s ease}
  .card.is-on{pointer-events:auto;z-index:4}
  .card.is-side{z-index:2}
  .title{font:400 clamp(14px,1.4vw,19px)/1.28 var(--serif);color:var(--ink);

  a.title{border-bottom:1px solid var(--rule);

  a.title:hover{border-bottom-color:var(--navy);color:var(--navy)}
  .role{margin-top:6px;font:300 italic clamp(12px,1.2vw,14px)/1.4 var(--serif);

  .desc{margin:6px 0 0;font:300 clamp(13px,1.25vw,15px)/1.5 var(--serif);color:var(--ink-2);
        text-wrap:pretty;
        display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .desc.forthcoming{font-style:italic;color:var(--ink-3);-webkit-line-clamp:2}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .tag{font:400 10px var(--mono);letter-spacing:.06em;color:var(--navy);
       border:1px solid color-mix(in srgb, var(--navy) 34%, var(--paper));
       border-radius:999px;padding:3px 9px;white-space:nowrap}

  .railwrap{position:relative;width:100%;flex:1 1 auto;min-height:0;max-height:100%;
            margin:0;overflow:hidden;display:flex;align-items:stretch}
  .railclip{position:relative;flex:1 1 auto;min-width:0;min-height:0;height:auto;
            -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 48px,#000 calc(100% - 48px),transparent);
            mask-image:linear-gradient(90deg,transparent 0,#000 48px,#000 calc(100% - 48px),transparent)}
  .rail{position:absolute;inset:0;display:block;width:100%;height:100%;overflow:visible;pointer-events:none}
  .rail .stroke{fill:none;stroke:var(--rule);stroke-width:1;stroke-linecap:square;
                stroke-linejoin:miter}
  .rail .tick{stroke:var(--rule);stroke-width:1;stroke-linecap:square}
  .apex{position:absolute;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;
        background:var(--navy);opacity:.55;pointer-events:none;z-index:3}
  .is-inventing .apex{width:1px;height:12px;margin:-6px 0 0 -.5px;border-radius:0;background:var(--ink-3);opacity:.9}
  .is-steering .apex{display:none}

  .nudge{appearance:none;background:none;border:0;padding:0;flex:0 0 22px;align-self:center;
         width:22px;height:22px;cursor:pointer;position:relative;
         color:var(--ink-3);opacity:.42;transition:opacity .2s ease,color .2s ease}
  .nudge:hover{opacity:.9;color:var(--navy)}
  .nudge.is-off{opacity:0;pointer-events:none}
  .nudge::before{content:'';position:absolute;left:50%;top:50%;
                 width:7px;height:7px;margin:-4px 0 0 -5px;
                 border-right:1px solid currentColor;border-top:1px solid currentColor;
                 transform:rotate(45deg)}
  .nudge-l::before{margin-left:-2px;transform:rotate(-135deg)}

  .nodes{position:absolute;inset:0;pointer-events:none;z-index:5}
  .yr{position:absolute;left:0;top:0;
      font:400 10px var(--mono);letter-spacing:.12em;color:var(--ink-3);
      white-space:nowrap;pointer-events:none;
      transform:translate(-50%, calc(-100% - 8px))}

  .belt{position:absolute;inset:0}

  /* inventing — squares slide along the ruler */
  .is-inventing .card{aspect-ratio:1;display:flex;flex-direction:column;
                     border:1px solid var(--rule);border-radius:1px;padding:14px 16px 16px}
  .is-inventing .desc{-webkit-line-clamp:unset;overflow:visible}
  .is-inventing .tags{margin-top:auto;padding-top:10px}

  /* surfacing — deeper arc; cards hang from the stroke and rise to the apex */
  .is-surfacing .card{padding:10px 12px 12px;border-radius:1px;
                     background:color-mix(in srgb, var(--paper) 92%, transparent)}
  .is-surfacing .apex{box-shadow:0 0 0 6px color-mix(in srgb, var(--navy) 18%, transparent)}

  /* steering — cards ride the jagged polyline */
  .is-steering .card{padding:10px 12px 12px;
                    background:color-mix(in srgb, var(--paper) 92%, transparent)}

  .foot{position:relative;z-index:2;flex:0 0 auto;
        display:flex;flex-wrap:wrap;align-items:center;font:400 12px var(--mono);letter-spacing:.06em;
        padding:clamp(12px,1.8vh,22px) 0 clamp(16px,3vw,28px)}
  .foot a{color:var(--ink-2);padding:0 9px;transition:color .18s ease}
  .foot a:first-child{padding-left:0}
  .foot a:last-child{padding-right:0}
  .foot a:hover{color:var(--navy)}
  .foot .sep{color:var(--ink-3);user-select:none}

  @media (max-width:720px){
    .page{--side:20px}
    .barrow{flex-wrap:wrap;white-space:normal}
    .barrow .lead{flex:1 1 100%;padding:0 0 10px;text-align:center;white-space:normal}
    .tabs{flex:1 1 100%;justify-content:center}
    .stage.on .name .l{transform:translate3d(-96px,0,-70px)}
    .stage.on .name .r{transform:translate3d(96px,0,-70px)}
  }
  @media (max-height:740px){
    .panel-inner{padding-top:clamp(18px,2.6vh,32px)}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition-duration:.01ms !important;animation:none !important}
    .card{transition:none}
  }
</style>

<script>

const stage    = document.getElementById('stage');
const panel    = document.getElementById('panel');
const gallery  = document.getElementById('gallery');
const rail     = document.getElementById('rail');
const railclip = document.getElementById('railclip');
const nodesEl  = document.getElementById('nodes');
const belt     = document.getElementById('belt');
const apex     = document.getElementById('apex');
const nudgeL   = document.getElementById('nudgeL');
const nudgeR   = document.getElementById('nudgeR');
const calm     = matchMedia('(prefers-reduced-motion: reduce)');
let openKey = null;
let items = [];
let t = 0;
let shown = 0;
let geo = null;
let anim = 0;
let wheelAcc = 0;
let wheelLock = 0;
let wheelDecay = 0;

/* Wheel: ~2.5× less twitchy than 1-event / 280ms.
   Pixel deltas scaled 0.4; step after 90 of accumulated delta; 520ms lock. */
const WHEEL_SCALE = 0.4;
const WHEEL_STEP = 90;
const WHEEL_COOL = 520;

stage.addEventListener('mouseenter', () => stage.classList.add('on'));
stage.addEventListener('mouseleave', () => stage.classList.remove('on'));

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function whenScore(date){
  const s = String(date || '');
  const year = Number((s.match(/\d{4}/) || [0])[0]);
  const ongoing = /[—–-]\s*$|present|ongoing|now/i.test(s.replace(/\d{4}/, ''));
  return year + (ongoing ? 0.5 : 0);
}

function pathLen(verts){
  let n = 0;
  for (let i = 1; i < verts.length; i++) n += Math.hypot(verts[i].x - verts[i-1].x, verts[i].y - verts[i-1].y);
  return n;
}

function atLength(verts, dist){
  if (!verts.length) return {x:0,y:0};
  if (dist <= 0) return {...verts[0]};
  for (let i = 1; i < verts.length; i++){
    const dx = verts[i].x - verts[i-1].x, dy = verts[i].y - verts[i-1].y;
    const len = Math.hypot(dx, dy);
    if (dist <= len || i === verts.length - 1){
      const u = len ? clamp(dist / len, 0, 1) : 0;
      return {x: verts[i-1].x + dx * u, y: verts[i-1].y + dy * u};
    }
    dist -= len;
  }
  return {...verts[verts.length - 1]};
}

function spanFor(w){
  return w < 520 ? 0.46 : 0.34;
}

function layout(mode, w, h){
  const pad = 36;
  const x1 = pad, x2 = w - pad;
  const span = spanFor(w);
  if (mode === 'inventing'){
    const y = 30;
    const spacing = (x2 - x1) * span;
    const card = Math.round(clamp(spacing * 0.86, 128, Math.min(236, h - 48)));
    return {
      kind:'line', d:`M${x1},${y} H${x2}`, x1, x2, y, span, card, hang: 12,
      at(u){ return {x: x1 + (x2 - x1) * u, y}; }
    };
  }
  if (mode === 'surfacing'){
    const card = Math.round(clamp(w * 0.24, 150, 210));
    const cy = Math.max(h * 0.42, 96);
    const rx = (x2 - x1) / 2;
    const ry = Math.max(72, Math.min(rx * 0.72, cy - 22, h * 0.46));
    const cx = w / 2;
    const d = `M${x1.toFixed(1)},${cy.toFixed(1)} A${rx.toFixed(1)},${ry.toFixed(1)} 0 0 1 ${x2.toFixed(1)},${cy.toFixed(1)}`;
    return {
      kind:'arc', d, cx, cy, rx, ry, span, card, hang: 10,
      at(u){
        const a = Math.PI * (1 - u);
        return {x: cx + rx * Math.cos(a), y: cy - ry * Math.sin(a)};
      }
    };
  }
  const card = Math.round(clamp(w * 0.24, 150, 220));
  const yMid = Math.max(36, (h - 130) * 0.38);
  const amp = Math.min((h - 140) * 0.28, 52);
  const way = [
    [0, .12], [0.16, .12], [0.16, -.95], [0.38, -.95],
    [0.38, .95], [0.60, .95], [0.60, -.32], [0.80, -.32],
    [0.80, .46], [1, .46]
  ];
  const verts = way.map(([p, v]) => ({x: x1 + (x2 - x1) * p, y: yMid + amp * v}));
  const d = verts.map((p, i) => `${i ? 'L' : 'M'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join('');
  const total = pathLen(verts);
  return {
    kind:'poly', d, verts, total, span, card, hang: 12,
    at(u){ return atLength(verts, total * u); }
  };
}

function atOff(off){
  if (!geo) return {x:0,y:0};
  const u = clamp(0.5 + off * geo.span, 0.02, 0.98);
  return geo.at(u);
}

function cardOpacity(off){
  const a = Math.abs(off);
  if (a >= 1.22) return 0;
  if (a <= 0.06) return 1;
  return clamp(1 - (a / 1.18) * 0.62, 0.35, 1);
}

function yearLabel(i){
  const d = String(items[i].date || '');
  if (!d) return '';
  const ongoing = /[—–-]\s*$|present|ongoing|now/i.test(d.replace(/\d{4}/, ''));
  if (ongoing) return d;
  if (i === 0) return d;
  const prev = String(items[i - 1].date || '');
  const y = (d.match(/\d{4}/) || [''])[0];
  const py = (prev.match(/\d{4}/) || [''])[0];
  return y && y === py ? '' : d;
}

function cardHTML(p){
  const tags = [].concat(p.tag || []).filter(Boolean);
  const title = esc(p.title);
  const desc = p.desc
    ? `<p class="desc">${esc(p.desc)}</p>`
    : `<p class="desc forthcoming">description forthcoming.</p>`;
  return `
    ${p.href
      ? `<a class="title" href="${esc(p.href)}" target="_blank" rel="noopener noreferrer">${title}</a>`
      : `<span class="title">${title}</span>`}
    ${p.role ? `<div class="role">${esc(p.role)}</div>` : ''}
    ${desc}
    ${tags.length ? `<div class="tags">${tags.map(tg => `<span class="tag">${esc(tg)}</span>`).join('')}</div>` : ''}`;
}

function setNudge(el, off){
  el.classList.toggle('is-off', off);
  el.disabled = off;
}

function paint(){
  if (!geo || !items.length) return;
  const hang = geo.hang;
  items.forEach((_, i) => {
    const el = belt.children[i];
    if (!el) return;
    const off = i - t;
    const op = cardOpacity(off);
    const pt = atOff(off);
    el.style.transform = `translate(${pt.x}px, ${pt.y + hang}px) translate(-50%, 0)`;
    el.style.opacity = String(op);
    el.style.pointerEvents = op > 0.2 ? 'auto' : 'none';
    el.classList.toggle('is-on', Math.abs(off) < 0.45);
    el.classList.toggle('is-side', op > 0.05 && Math.abs(off) >= 0.45);
    el.setAttribute('aria-hidden', op < 0.08 ? 'true' : 'false');
  });

  const focus = atOff(0);
  apex.style.left = focus.x + 'px';
  apex.style.top = focus.y + 'px';

  const labels = [];
  items.forEach((_, i) => {
    const off = i - t;
    if (Math.abs(off) > 1.18) return;
    const yr = yearLabel(i);
    if (!yr) return;
    const pt = atOff(off);
    labels.push(`<span class="yr" style="left:${pt.x}px;top:${pt.y}px;opacity:${cardOpacity(off).toFixed(2)}">${esc(yr)}</span>`);
  });
  nodesEl.innerHTML = labels.join('');
  setNudge(nudgeL, shown <= 0);
  setNudge(nudgeR, shown >= items.length - 1);
}

function draw(){
  const w = railclip.clientWidth;
  const h = railclip.clientHeight;
  if (w < 8 || h < 8 || !openKey || !items.length) return;
  geo = layout(openKey, w, h);
  gallery.style.setProperty('--card', geo.card + 'px');
  const parts = [`<path class="stroke" d="${geo.d}"/>`];
  if (geo.kind === 'line'){
    const units = 40;
    for (let i = 0; i <= units; i++){
      const x = geo.x1 + (geo.x2 - geo.x1) * i / units;
      const hh = i % 8 === 0 ? 9 : i % 4 === 0 ? 5 : 3;
      parts.push(`<line class="tick" x1="${x}" y1="${geo.y}" x2="${x}" y2="${geo.y + hh}"/>`);
    }
  }
  rail.setAttribute('viewBox', `0 0 ${w} ${h}`);
  rail.setAttribute('preserveAspectRatio', 'none');
  rail.innerHTML = parts.join('');
  paint();
}

function animateT(to){
  const from = t;
  const start = performance.now();
  const dur = 480;
  cancelAnimationFrame(anim);
  const tick = now => {
    const p = Math.min(1, (now - start) / dur);
    const e = 1 - Math.pow(1 - p, 3);
    t = from + (to - from) * e;
    paint();
    if (p < 1) anim = requestAnimationFrame(tick);
    else { t = to; paint(); }
  };
  anim = requestAnimationFrame(tick);
}

function go(i, instant){
  const max = Math.max(items.length - 1, 0);
  const next = clamp(i, 0, max);
  shown = next;
  if (instant || calm.matches){
    cancelAnimationFrame(anim);
    t = next;
    paint();
    return;
  }
  animateT(next);
}

function render(key){
  items = (PROJECTS[key] || []).slice().sort((a, b) => whenScore(b.date) - whenScore(a.date));
  gallery.classList.remove('is-inventing', 'is-surfacing', 'is-steering');
  gallery.classList.add('is-' + key);
  shown = 0;
  t = 0;
  cancelAnimationFrame(anim);
  belt.innerHTML = items.map((p, i) =>
    `<article class="card" data-i="${i}">${cardHTML(p)}</article>`).join('');
  nodesEl.innerHTML = '';
  requestAnimationFrame(() => {
    draw();
    requestAnimationFrame(draw);
  });
}

belt.addEventListener('click', e => {
  const card = e.target.closest('.card');
  if (!card) return;
  const i = +card.dataset.i;
  if (i !== shown){
    e.preventDefault();
    go(i, calm.matches);
    gallery.focus();
  }
});

nudgeL.addEventListener('click', () => { go(shown - 1, calm.matches); gallery.focus(); });
nudgeR.addEventListener('click', () => { go(shown + 1, calm.matches); gallery.focus(); });

panel.addEventListener('wheel', e => {
  if (!openKey || items.length < 2) return;
  const primary = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  if (!primary) return;
  e.preventDefault();
  let d = primary;
  if (e.deltaMode === 1) d *= 40;
  else if (e.deltaMode === 2) d *= 80;
  else d *= WHEEL_SCALE;
  if (Math.sign(d) && Math.sign(wheelAcc) && Math.sign(d) !== Math.sign(wheelAcc)) wheelAcc = 0;
  wheelAcc += d;
  clearTimeout(wheelDecay);
  wheelDecay = setTimeout(() => { wheelAcc = 0; }, 220);
  const now = Date.now();
  if (now < wheelLock) return;
  if (Math.abs(wheelAcc) < WHEEL_STEP) return;
  const dir = Math.sign(wheelAcc);
  wheelAcc = 0;
  wheelLock = now + (calm.matches ? 90 : WHEEL_COOL);
  go(shown + dir, calm.matches);
}, {passive: false});

gallery.addEventListener('keydown', e => {
  if (!openKey || !items.length) return;
  if (e.key === 'ArrowRight')      go(shown + 1, calm.matches);
  else if (e.key === 'ArrowLeft')  go(shown - 1, calm.matches);
  else if (e.key === 'Home')       go(0, calm.matches);
  else if (e.key === 'End')        go(items.length - 1, calm.matches);
  else return;
  e.preventDefault();
});

window.addEventListener('resize', () => { if (openKey) draw(); });

const FADE_MS = 200;
let turn = 0, swapTimer = 0;

function setCategory(key){
  const me = ++turn;
  clearTimeout(swapTimer);
  const showing = panel.classList.contains('open');
  panel.classList.remove('open');

  const wait = (showing && !calm.matches) ? FADE_MS : 0;
  swapTimer = setTimeout(() => {
    if (me !== turn) return;
    document.querySelectorAll('.tab').forEach(b =>
      b.setAttribute('aria-expanded', String(b.dataset.key === key)));
    if (key){
      render(key);
      panel.classList.add('open');
      gallery.focus();
    } else {
      items = [];
      geo = null;
      shown = 0;
      t = 0;
      belt.innerHTML = '';
      nodesEl.innerHTML = '';
      rail.innerHTML = '';
      setNudge(nudgeL, true);
      setNudge(nudgeR, true);
    }
  }, wait);
}

document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    openKey = openKey === btn.dataset.key ? null : btn.dataset.key;
    setCategory(openKey);
  });
});
</script>
</body>
</html>
